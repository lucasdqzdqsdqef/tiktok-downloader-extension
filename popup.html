<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader Settings</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-wrapper">
        <img src="gui_logo.png" class="logo-img" alt="Logo">
      </div>
      <div class="title-wrapper">
        <h1>TikTok Downloader</h1>
        <span class="version">v1.2</span>
      </div>
    </div>
    
    <div class="card">
      <div class="input-group">
        <label for="subfolder">Download Subfolder</label>
        <p class="desc">Leave empty for default directory.</p>
        <div class="input-wrapper">
          <input type="text" id="subfolder" placeholder="e.g. TikToks">
          <div class="focus-border"></div>
        </div>
      </div>

      <div class="input-group">
        <label for="naming">File Naming Template</label>
        <p class="desc">Tags: <span class="tag">{uploader}</span>, <span class="tag">{id}</span></p>
        <div class="input-wrapper">
          <input type="text" id="naming" value="{uploader} - {id}">
          <div class="focus-border"></div>
        </div>
      </div>
    </div>

    <button id="saveBtn" class="btn-save">
      <span>Save Preferences</span>
      <div class="btn-bg"></div>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
